<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Dev Card Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --error: #f85149;
            --border: #30363d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #7ee787, #aff5b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subheading {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        input {
            width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        button.generate-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button.generate-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button.generate-btn:active { transform: translateY(0); }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Loading Skeleton */
        .skeleton {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            width: 300px;
            height: 440px;
            margin: 0 auto;
            padding: 40px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        /* Result Area */
        #result-container {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-secondary {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-secondary:hover { background: #30363d; }

        .pdf-btn {
            background: #f1f2f3;
            color: #1a1a1a;
        }
        .pdf-btn:hover { background: #ffffff; }

        #error-msg {
            color: var(--error);
            margin-top: 1rem;
            display: none;
            font-weight: 600;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>GitHub Dev Card Generator</h1>
        <p class="subheading">Enter any public GitHub username</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="e.g. torvalds" spellcheck="false">
            <button class="generate-btn" id="generate-btn" onclick="generateCard()">Generate Card</button>
        </div>

        <!-- Loading State -->
        <div id="loading-skeleton" class="skeleton">
            <div style="width: 60px; height: 60px; background: var(--border); border-radius: 50%; margin-bottom: 20px;"></div>
            <div style="width: 100%; height: 20px; background: var(--border); border-radius: 4px; margin-bottom: 10px;"></div>
            <div style="width: 80%; height: 20px; background: var(--border); border-radius: 4px; margin-bottom: 10px;"></div>
        </div>

        <!-- Result State -->
        <div id="result-container" class="hidden">
            <div id="card-render"></div>
            
            <div class="action-buttons">
                <button class="btn-secondary" id="share-btn" onclick="copyLink()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>
                    Copy Link
                </button>
                <button class="btn-secondary pdf-btn" onclick="downloadPDF()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"></path><path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"></path></svg>
                    Download PNG
                </button>
            </div>
        </div>

        <div id="error-msg">User not found or API error. Try again!</div>
    </div>

    <script>
        let currentCardUrl = '';
        let currentUsername = '';

        async function generateCard() {
            const usernameInput = document.getElementById('username');
            const username = usernameInput.value.trim();
            const btn = document.getElementById('generate-btn');
            const skeleton = document.getElementById('loading-skeleton');
            const result = document.getElementById('result-container');
            const error = document.getElementById('error-msg');
            const cardRender = document.getElementById('card-render');

            if (!username) return;
            currentUsername = username;

            error.style.display = 'none';
            result.classList.add('hidden');
            btn.disabled = true;
            skeleton.style.display = 'block';

            try {
                const response = await fetch('https://github-card-dev.onrender.com/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                if (!response.ok) throw new Error('Failed to generate');

                const data = await response.json();
                
                cardRender.innerHTML = '';
                setTimeout(() => {
                    cardRender.innerHTML = data.html;
                    skeleton.style.display = 'none';
                    result.classList.remove('hidden');
                }, 500);
                
                currentCardUrl = `https://github-card-dev.onrender.com${data.card_url}`;
                
            } catch (err) {
                console.error(err);
                skeleton.style.display = 'none';
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // High-quality PNG download using html2canvas (scale 4x = crisp)
        async function downloadPDF() {
            const element = document.getElementById('card-to-download');
            if (!element) return;

            const pdfBtn = document.querySelector('.pdf-btn');
            const originalHTML = pdfBtn.innerHTML;
            pdfBtn.innerHTML = 'Generating...';
            pdfBtn.disabled = true;

            try {
                const canvas = await html2canvas(element, {
                    scale: 4,                      // 4x resolution — very crisp
                    backgroundColor: '#0d1117',
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    imageTimeout: 15000,
                });

                // Download as PNG (much sharper than PDF for card visuals)
                const link = document.createElement('a');
                link.download = `github-card-${currentUsername}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('Export failed:', err);
                alert('Export failed. Try again!');
            } finally {
                pdfBtn.innerHTML = originalHTML;
                pdfBtn.disabled = false;
            }
        }

        function copyLink() {
            if (!currentCardUrl) return;
            navigator.clipboard.writeText(currentCardUrl);
            const shareBtn = document.getElementById('share-btn');
            const originalText = shareBtn.innerHTML;
            shareBtn.innerHTML = 'Copied!';
            setTimeout(() => { shareBtn.innerHTML = originalText; }, 2000);
        }

        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateCard();
        });
    </script>
</body>
</html>
